<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Panel Analysis Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',Arial,sans-serif;background:#0b1220;color:white;height:100vh;overflow:hidden;}
#pw-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:radial-gradient(ellipse at 30% 20%,#1a2a5e33 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,#0d2a1e22 0%,transparent 60%),#0b1220;}
.pw-card{width:100%;max-width:440px;background:#151820;border:1px solid #252a3a;border-radius:20px;padding:44px 40px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.5);}
.pw-exaze-logo{height:56px;margin-bottom:20px;object-fit:contain;}
.pw-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:#f1f5f9;margin-bottom:4px;}
.pw-title span{color:#4f7cff;}
.pw-tagline{color:#b0bac8;font-size:12px;font-weight:300;margin-bottom:32px;line-height:1.5;}
.pw-lock{font-size:36px;margin-bottom:16px;}
.pw-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#b0bac8;margin-bottom:8px;text-align:left;}
.pw-input{width:100%;background:#1c2030;border:1px solid #252a3a;border-radius:10px;padding:14px 18px;color:white;font-size:16px;font-family:'DM Sans',sans-serif;text-align:center;letter-spacing:.15em;margin-bottom:14px;transition:border-color .2s;outline:none;}
.pw-input:focus{border-color:#4f7cff;}
.pw-btn{width:100%;background:#4f7cff;color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;cursor:pointer;transition:all .2s;}
.pw-btn:hover{background:#3d6ae0;transform:translateY(-1px);}
.pw-error{color:#ff6b6b;font-size:12px;margin-top:10px;min-height:18px;}
.pw-footer{margin-top:28px;padding-top:18px;border-top:1px solid #1f2937;font-size:11px;color:#6b7080;line-height:1.6;}
#app{display:none;height:100vh;}
#app iframe{width:100%;height:100%;border:none;}
</style>
</head>

&lt;style&gt;
:root{--bg:#0d0f14;--surface:#151820;--card:#1c2030;--border:#252a3a;--accent:#4f7cff;--accent2:#ff6b6b;--accent3:#34d399;--accent4:#fbbf24;--accent5:#a78bfa;--text:#e8eaf0;--muted:#b0bac8;--pos:#34d399;--neg:#ff6b6b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:&#x27;DM Sans&#x27;,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.brand{font-family:&#x27;Syne&#x27;,sans-serif;font-size:36px;font-weight:800;letter-spacing:-.02em;}
.brand span{color:var(--accent);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;background:radial-gradient(ellipse at 30% 20%,#1a2a5e22 0%,transparent 60%),var(--bg);}
.loading-msg{color:var(--muted);font-size:13px;}
#dashboard{display:none;}
.nav{display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:100;overflow-x:auto;}
.nav-brand{font-family:&#x27;Syne&#x27;,sans-serif;font-weight:800;font-size:14px;color:var(--accent);margin-right:20px;padding:13px 0;white-space:nowrap;}
.nav-brand span{color:var(--text);}
.tab{padding:13px 14px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.page{display:none;padding:20px;animation:fadeIn .2s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-header{margin-bottom:20px;}
.page-title{font-family:&#x27;Syne&#x27;,sans-serif;font-size:20px;font-weight:800;}
.page-sub{color:var(--muted);font-size:12px;margin-top:3px;font-weight:300;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
.card-title{font-family:&#x27;Syne&#x27;,sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card-title::after{content:&#x27;&#x27;;flex:1;height:1px;background:var(--border);}
.kpi-val{font-family:&#x27;Syne&#x27;,sans-serif;font-size:22px;font-weight:800;line-height:1;}
.kpi-label{font-size:11px;color:var(--muted);margin-top:4px;font-weight:700;}
.kpi-sub{font-size:11px;color:#9ca3af;margin-top:2px;}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;}
.badge-blue{background:#1a2a5e;color:var(--accent);border:1px solid #2a3d7a;}
.badge-red{background:#2a1414;color:var(--neg);border:1px solid #4a2020;}
.badge-green{background:#0d2a1e;color:var(--pos);border:1px solid #1a4a30;}
.badge-yellow{background:#2a1e0a;color:var(--accent4);border:1px solid #4a3010;}
.sev-Critical{background:#2a1414;color:var(--neg);border:1px solid #4a2020;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.sev-High{background:#2a1e0a;color:var(--accent4);border:1px solid #4a3010;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.sev-Medium{background:#1a2a5e;color:var(--accent);border:1px solid #2a3d7a;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.sev-Low{background:#0d2a1e;color:var(--pos);border:1px solid #1a4a30;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.stk-TA{background:#1a1a5e;color:#93c5fd;border:1px solid #2a3d7a;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;}
.stk-M{background:#1a2a5e;color:#c4b5fd;border:1px solid #3730a3;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;}
.stk-P{background:#0d2a1e;color:#6ee7b7;border:1px solid #1a4a30;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;}
.stk-HC{background:#2a1e0a;color:#fde68a;border:1px solid #4a3010;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.bar-label{width:70px;font-size:11px;color:var(--muted);flex-shrink:0;}
.bar-track{flex:1;background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;}
.bar-val{width:32px;font-size:11px;font-family:&#x27;Syne&#x27;,sans-serif;font-weight:700;text-align:right;flex-shrink:0;}
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{text-align:left;padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;}
.data-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top;line-height:1.5;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:rgba(79,124,255,.04);}
.scroll-y{max-height:320px;overflow-y:auto;padding-right:4px;}
.scroll-y::-webkit-scrollbar{width:3px;}
.scroll-y::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
.section-label{font-family:&#x27;Syne&#x27;,sans-serif;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;}
.summary-block{background:var(--surface);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;font-size:13px;line-height:1.8;font-weight:300;margin-bottom:10px;}
.intervention-block{background:var(--surface);border-left:3px solid var(--accent4);border-radius:0 8px 8px 0;padding:10px 14px;font-size:12px;line-height:1.7;margin-top:8px;}
.quote{background:var(--surface);border-left:2px solid var(--accent5);border-radius:0 6px 6px 0;padding:10px 14px;font-size:12px;color:var(--text);line-height:1.8;margin-bottom:7px;opacity:.9;}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:12px;}
.row-gap{display:flex;flex-direction:column;gap:12px;}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

// ── GLOBALS ──
var DB = {};

// ── UTILS ──
function $(id){ return document.getElementById(id); }
function dv(cls){ var e=document.createElement(&#x27;div&#x27;); e.className=cls; return e; }
function h(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function val(row,col){ return (row&amp;&amp;row[col]!=null)?String(row[col]):&#x27;&#x27;; }
function num(row,col){ return +(row&amp;&amp;row[col])||0; }
function stkcls(s){if(!s)return&#x27;&#x27;;var m=s.toLowerCase();if(m.includes(&#x27;talent&#x27;)||m.includes(&#x27;acq&#x27;))return&#x27;stk-TA&#x27;;if(m.includes(&#x27;manage&#x27;))return&#x27;stk-M&#x27;;if(m.includes(&#x27;human&#x27;))return&#x27;stk-HC&#x27;;return&#x27;stk-P&#x27;;}
function sevcls(s){return&#x27;sev-&#x27;+(s||&#x27;Low&#x27;);}
function scoreColor(v){return v&gt;=70?&#x27;var(--pos)&#x27;:v&gt;=50?&#x27;var(--accent4)&#x27;:&#x27;var(--neg)&#x27;;}
function gapColor(s){var m={Critical:&#x27;var(--neg)&#x27;,High:&#x27;var(--accent4)&#x27;,Medium:&#x27;var(--accent)&#x27;,Low:&#x27;var(--pos)&#x27;};return m[s]||&#x27;var(--muted)&#x27;;}

function showTab(name, el){
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(function(t){t.classList.remove(&#x27;active&#x27;);});
  document.querySelectorAll(&#x27;.page&#x27;).forEach(function(p){p.classList.remove(&#x27;active&#x27;);});
  if(el)el.classList.add(&#x27;active&#x27;);
  var pg = $(&#x27;p-&#x27;+name);
  if(pg)pg.classList.add(&#x27;active&#x27;);
}

// ── BOOT ──
window.addEventListener(&#x27;load&#x27;, function(){
  try{
    var binary = atob(EMBEDDED_DATA);
    var bytes = new Uint8Array(binary.length);
    for(var i=0;i&lt;binary.length;i++) bytes[i]=binary.charCodeAt(i);
    var wb = XLSX.read(bytes, {type:&#x27;array&#x27;});
    wb.SheetNames.forEach(function(n){
      DB[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], {defval:&#x27;&#x27;});
    });
    buildAll();
    $(&#x27;loading&#x27;).style.display=&#x27;none&#x27;;
    $(&#x27;dashboard&#x27;).style.display=&#x27;block&#x27;;
  }catch(err){
    $(&#x27;loading&#x27;).innerHTML=&#x27;&lt;div style=&quot;color:var(--neg);font-size:14px;&quot;&gt;Error loading data: &#x27;+err.message+&#x27;&lt;/div&gt;&#x27;;
  }
});

function buildAll(){
  buildSummary();
  buildCategory();
  buildRatingGap();
  buildStakeholder();
  buildHeatmap();
  buildEvidence();
}

// ── PAGE 1: EXECUTIVE SUMMARY ──
function buildSummary(){
  var pg = $(&#x27;p-summary&#x27;); pg.innerHTML=&#x27;&#x27;;
  var rawRows   = DB[&#x27;Detailed Responses&#x27;]||[];
  var ratingSum = DB[&#x27;Stakeholder Rating Summary&#x27;]||[];
  var gapData   = DB[&#x27;Rating Gap Matrix&#x27;]||[];
  var agreeData = DB[&#x27;Agreement vs Divergence&#x27;]||[];
  var kpiData   = DB[&#x27;KPI Summary&#x27;]||[];

  var allStks=[];
  rawRows.forEach(function(r){if(allStks.indexOf(r.Stakeholder)&lt;0&amp;&amp;r.Stakeholder)allStks.push(r.Stakeholder);});
  var cats=[];
  rawRows.forEach(function(r){if(cats.indexOf(r.Category)&lt;0&amp;&amp;r.Category)cats.push(r.Category);});

  var hdr=dv(&#x27;page-header&#x27;);
  var pt=h(&#x27;div&#x27;,&#x27;page-title&#x27;); pt.textContent=&#x27;Executive Summary&#x27;;
  var ps=h(&#x27;div&#x27;,&#x27;page-sub&#x27;); ps.textContent=&#x27;High-level overview across all stakeholders and categories&#x27;;
  hdr.appendChild(pt); hdr.appendChild(ps); pg.appendChild(hdr);

  // Correct counts:
  // totalResp = sum of all rows
  // totalUnique = OVERALL unique respondents = max from agreeData (not sum — that double-counts)
  // Use distinct RespondedBy from rawRows when possible; fallback to max in agreeData
  var respondentSet={};
  rawRows.forEach(function(r){if(r.RespondedBy)respondentSet[r.RespondedBy]=1;});
  var totalUnique=Object.keys(respondentSet).length||Math.max.apply(null,agreeData.map(function(r){return +r[&#x27;Unique Respondents&#x27;]||0;}));
  var totalResp=rawRows.length||agreeData.reduce(function(a,r){return a+(+r[&#x27;Total Responses&#x27;]||0);},0);
  var ratingVals=ratingSum.map(function(r){return +(r[&#x27;Average Rating (1-5)&#x27;])||0;}).filter(Boolean);
  var avgScore=ratingVals.length?Math.round((ratingVals.reduce(function(a,b){return a+b;},0)/ratingVals.length)*20):0;

  // ── KPI GRID (3 tiles) ────────────────────────────────────────────────────
  var kpiGrid=dv(&#x27;&#x27;); kpiGrid.style.cssText=&#x27;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;&#x27;;

  // Tile 1: Responses + Unique combined
  var t1=dv(&#x27;card&#x27;);
  var t1top=dv(&#x27;&#x27;); t1top.style.cssText=&#x27;display:flex;justify-content:space-between;align-items:flex-start;&#x27;;
  var t1a=dv(&#x27;&#x27;);
  var t1av=h(&#x27;div&#x27;,&#x27;kpi-val&#x27;); t1av.textContent=totalResp; t1av.style.color=&#x27;var(--accent)&#x27;;
  var t1al=h(&#x27;div&#x27;,&#x27;kpi-label&#x27;); t1al.textContent=&#x27;Total Responses&#x27;;
  t1a.appendChild(t1av); t1a.appendChild(t1al);
  var t1b=dv(&#x27;&#x27;); t1b.style.cssText=&#x27;text-align:right;&#x27;;
  var t1bv=h(&#x27;div&#x27;,&#x27;kpi-val&#x27;); t1bv.textContent=totalUnique; t1bv.style.cssText=&#x27;font-size:20px;color:var(--accent3);&#x27;;
  var t1bl=h(&#x27;div&#x27;,&#x27;kpi-label&#x27;); t1bl.textContent=&#x27;Unique People&#x27;;
  t1b.appendChild(t1bv); t1b.appendChild(t1bl);
  t1top.appendChild(t1a); t1top.appendChild(t1b); t1.appendChild(t1top);
  var t1s=h(&#x27;div&#x27;,&#x27;kpi-sub&#x27;); t1s.textContent=totalUnique+&#x27; distinct respondents across &#x27;+totalResp+&#x27; responses&#x27;;
  t1.appendChild(t1s);
  kpiGrid.appendChild(t1);

  // Tile 2: Avg Rating
  var t2=dv(&#x27;card&#x27;);
  var t2v=h(&#x27;div&#x27;,&#x27;kpi-val&#x27;); t2v.textContent=avgScore+&#x27;/100&#x27;; t2v.style.color=&#x27;var(--accent4)&#x27;;
  var t2l=h(&#x27;div&#x27;,&#x27;kpi-label&#x27;); t2l.textContent=&#x27;Avg Rating Score&#x27;;
  var t2s=h(&#x27;div&#x27;,&#x27;kpi-sub&#x27;); t2s.textContent=&#x27;from structured rating questions&#x27;;
  t2.appendChild(t2v); t2.appendChild(t2l); t2.appendChild(t2s);
  kpiGrid.appendChild(t2);

  // Tile 3: Stakeholders + Categories
  var t3=dv(&#x27;card&#x27;);
  var t3top=dv(&#x27;&#x27;); t3top.style.cssText=&#x27;display:flex;justify-content:space-between;align-items:flex-start;&#x27;;
  var t3a=dv(&#x27;&#x27;);
  var t3av=h(&#x27;div&#x27;,&#x27;kpi-val&#x27;); t3av.textContent=allStks.length; t3av.style.color=&#x27;var(--accent5)&#x27;;
  var t3al=h(&#x27;div&#x27;,&#x27;kpi-label&#x27;); t3al.textContent=&#x27;Stakeholders&#x27;;
  t3a.appendChild(t3av); t3a.appendChild(t3al);
  var t3b=dv(&#x27;&#x27;); t3b.style.cssText=&#x27;text-align:right;&#x27;;
  var t3bv=h(&#x27;div&#x27;,&#x27;kpi-val&#x27;); t3bv.textContent=cats.length; t3bv.style.cssText=&#x27;font-size:20px;color:var(--pos);&#x27;;
  var t3bl=h(&#x27;div&#x27;,&#x27;kpi-label&#x27;); t3bl.textContent=&#x27;Categories&#x27;;
  t3b.appendChild(t3bv); t3b.appendChild(t3bl);
  t3top.appendChild(t3a); t3top.appendChild(t3b); t3.appendChild(t3top);
  var t3s=h(&#x27;div&#x27;,&#x27;kpi-sub&#x27;); t3s.textContent=&#x27;groups surveyed across &#x27;+cats.length+&#x27; focus areas&#x27;;
  t3.appendChild(t3s);
  kpiGrid.appendChild(t3);


  // ── Tile 4: Time To Offer ──
  var kpiTTO = kpiData.find(function(r){return val(r,&#x27;KPI&#x27;)===&#x27;Time To Offer&#x27;;});
  var ttoVal   = kpiTTO ? val(kpiTTO,&#x27;Value&#x27;).replace(/[~-]/g,&#x27;&#x27;).trim() : &#x27;N/A&#x27;;
  var ttoNum   = kpiTTO ? +val(kpiTTO,&#x27;Numeric&#x27;) : null;
  var t4=dv(&#x27;card&#x27;);
  var t4v=h(&#x27;div&#x27;,&#x27;kpi-val&#x27;); t4v.textContent=ttoVal; t4v.style.color=&#x27;var(--accent3)&#x27;;
  var t4l=h(&#x27;div&#x27;,&#x27;kpi-label&#x27;); t4l.textContent=&#x27;Time To Offer&#x27;;
  var t4s=h(&#x27;div&#x27;,&#x27;kpi-sub&#x27;); t4s.textContent=&#x27;avg days: panel interview → offer decision&#x27;;
  t4.appendChild(t4v); t4.appendChild(t4l); t4.appendChild(t4s);
  kpiGrid.appendChild(t4);

  // ── Tile 5: Panel-to-Offer Conversion Rate ──
  var kpiCR  = kpiData.find(function(r){return val(r,&#x27;KPI&#x27;)===&#x27;Panel-to-Offer Conversion Rate&#x27;;});
  var crVal  = kpiCR ? val(kpiCR,&#x27;Value&#x27;).replace(/[~-]/g,&#x27;&#x27;).trim() : &#x27;N/A&#x27;;
  var crNum  = kpiCR ? +val(kpiCR,&#x27;Numeric&#x27;) : null;

// ── PAGE 5: QUESTION HEATMAP ──
function buildHeatmap(){
  var pg=$(&#x27;p-heatmap&#x27;); pg.innerHTML=&#x27;&#x27;;
  var rawRows=DB[&#x27;Detailed Responses&#x27;]||[];
  var structuredTypes=[&#x27;Acceptance&#x27;,&#x27;Scale1–5&#x27;,&#x27;Effectiveness&#x27;,&#x27;Frequency&#x27;,&#x27;Performance&#x27;,&#x27;Likelihood&#x27;];

  var hdr=dv(&#x27;page-header&#x27;);
  var pt=h(&#x27;div&#x27;,&#x27;page-title&#x27;); pt.textContent=&#x27;Question Response Heatmap&#x27;;
  var ps=h(&#x27;div&#x27;,&#x27;page-sub&#x27;); ps.textContent=&#x27;Computed from raw responses — n counts include all responses&#x27;;
  hdr.appendChild(pt); hdr.appendChild(ps); pg.appendChild(hdr);

  function getSentiment(response, rtype){
    var r=(response||&#x27;&#x27;).trim().toLowerCase();
    if(rtype===&#x27;Acceptance&#x27;) return r===&#x27;yes&#x27;?&#x27;pos&#x27;:r===&#x27;no&#x27;?&#x27;neg&#x27;:&#x27;neu&#x27;;
    if(rtype===&#x27;Scale1–5&#x27;){var v=parseFloat(r);if(!isNaN(v))return v&gt;=4?&#x27;pos&#x27;:v&lt;=2?&#x27;neg&#x27;:&#x27;neu&#x27;;return &#x27;neu&#x27;;}
    if(rtype===&#x27;Effectiveness&#x27;) return r===&#x27;effective&#x27;?&#x27;pos&#x27;:r===&#x27;ineffective&#x27;?&#x27;neg&#x27;:&#x27;neu&#x27;;
    if(rtype===&#x27;Frequency&#x27;) return [&#x27;always&#x27;,&#x27;often&#x27;].indexOf(r)&gt;=0?&#x27;pos&#x27;:[&#x27;never&#x27;,&#x27;rarely&#x27;].indexOf(r)&gt;=0?&#x27;neg&#x27;:&#x27;neu&#x27;;
    if(rtype===&#x27;Performance&#x27;) return r===&#x27;exceeds expectations&#x27;?&#x27;pos&#x27;:r===&#x27;below expectations&#x27;?&#x27;neg&#x27;:&#x27;neu&#x27;;
    if(rtype===&#x27;Likelihood&#x27;) return [&#x27;definitely&#x27;,&#x27;probably&#x27;].indexOf(r)&gt;=0?&#x27;pos&#x27;:[&#x27;definitely not&#x27;,&#x27;probably not&#x27;].indexOf(r)&gt;=0?&#x27;neg&#x27;:&#x27;neu&#x27;;
    return &#x27;neu&#x27;;
  }

  var grouped={};
  rawRows.forEach(function(row){
    if(structuredTypes.indexOf(row.ResponseType)&lt;0) return;
    var key=row.Category+&#x27;|||&#x27;+row.Question+&#x27;|||&#x27;+row.Stakeholder+&#x27;|||&#x27;+row.ResponseType;
    if(!grouped[key]) grouped[key]={Category:row.Category,Question:row.Question,Stakeholder:row.Stakeholder,type:row.ResponseType,n:0,pos:0,neg:0,neu:0,scores:[]};
    var g=grouped[key];
    g.n++;
    var resp=row.Response||(row.Text||&#x27;&#x27;).split(&#x27;.&#x27;)[0].trim();
    var sent=getSentiment(resp,row.ResponseType);
    if(sent===&#x27;pos&#x27;)g.pos++;else if(sent===&#x27;neg&#x27;)g.neg++;else g.neu++;
    if(row.ResponseType===&#x27;Scale1–5&#x27;){var sc=parseFloat(resp);if(!isNaN(sc))g.scores.push(sc);}
  });

  var computed=Object.values(grouped).map(function(g){
    var posPct=g.n?+(g.pos/g.n*100).toFixed(1):0;
    var negPct=g.n?+(g.neg/g.n*100).toFixed(1):0;
    var neuPct=+Math.max(0,100-posPct-negPct).toFixed(1);
    var avgScore=g.scores.length?(g.scores.reduce(function(a,b){return a+b;},0)/g.scores.length).toFixed(2):null;
    var signal=posPct&gt;=75?&#x27;Strong agreement&#x27;:posPct&gt;=50?&#x27;Mixed / Neutral&#x27;:&#x27;Divided&#x27;;
    return {Category:g.Category,Question:g.Question,Stakeholder:g.Stakeholder,type:g.type,n:g.n,&#x27;Positive %&#x27;:posPct,&#x27;Negative %&#x27;:negPct,&#x27;Neutral %&#x27;:neuPct,&#x27;Avg Score (1-5)&#x27;:avgScore,Signal:signal};
  });

  var cats=[];
  computed.forEach(function(r){if(cats.indexOf(r.Category)&lt;0)cats.push(r.Category);});

  cats.forEach(function(cat){
    var lbl=h(&#x27;div&#x27;,&#x27;section-label&#x27;); lbl.textContent=cat; pg.appendChild(lbl);
    var catRows=computed.filter(function(r){return r.Category===cat;});
    var stks=[];
    catRows.forEach(function(r){if(stks.indexOf(r.Stakeholder)&lt;0)stks.push(r.Stakeholder);});
    stks.forEach(function(stk){
      var stkRows=catRows.filter(function(r){return r.Stakeholder===stk;});
      var card=dv(&#x27;card&#x27;); card.style.marginBottom=&#x27;10px&#x27;;
      var ct=h(&#x27;div&#x27;,&#x27;card-title&#x27;);
      var sp=document.createElement(&#x27;span&#x27;); sp.className=stkcls(stk); sp.textContent=stk;
      ct.appendChild(sp); card.appendChild(ct);
      stkRows.forEach(function(row){
        var pos=row[&#x27;Positive %&#x27;],neg=row[&#x27;Negative %&#x27;],neut=row[&#x27;Neutral %&#x27;];
        var avgScore=row[&#x27;Avg Score (1-5)&#x27;],n=row.n,signal=row.Signal;
        var isScale=row.type===&#x27;Scale1–5&#x27;;
        var qBlock=dv(&#x27;&#x27;); qBlock.style.cssText=&#x27;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);&#x27;;
        var qTop=dv(&#x27;&#x27;); qTop.style.cssText=&#x27;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;gap:8px;&#x27;;
        var qText=h(&#x27;div&#x27;); qText.style.cssText=&#x27;font-size:12px;font-weight:500;flex:1;&#x27;; qText.textContent=row.Question;
        var qMeta=dv(&#x27;&#x27;); qMeta.style.cssText=&#x27;text-align:right;white-space:nowrap;flex-shrink:0;&#x27;;
        if(isScale&amp;&amp;avgScore){var sc=Math.round(parseFloat(avgScore)*20);var scDiv=h(&#x27;div&#x27;);scDiv.style.cssText=&#x27;font-family:Syne,sans-serif;font-size:15px;font-weight:800;color:&#x27;+scoreColor(sc)+&#x27;;&#x27;;scDiv.textContent=avgScore+&#x27;/5&#x27;;qMeta.appendChild(scDiv);}
        var subMeta=h(&#x27;div&#x27;); subMeta.style.cssText=&#x27;font-size:10px;color:var(--muted);&#x27;;
        subMeta.textContent=&#x27;n=&#x27;+n+&#x27; · &#x27;+signal+(isScale?&#x27; (scale)&#x27;:&#x27; (&#x27;+row.type+&#x27;)&#x27;);
        qMeta.appendChild(subMeta);
        qTop.appendChild(qText); qTop.appendChild(qMeta); qBlock.appendChild(qTop);
        function mkBar(label,pct,color){
          var brow=dv(&#x27;bar-row&#x27;);
          var l=h(&#x27;div&#x27;,&#x27;bar-label&#x27;);l.style.width=&#x27;60px&#x27;;l.style.color=color;l.style.fontSize=&#x27;11px&#x27;;l.textContent=label;
          var track=dv(&#x27;bar-track&#x27;);var fill=dv(&#x27;bar-fill&#x27;);fill.style.width=pct+&#x27;%&#x27;;fill.style.background=color;
          track.appendChild(fill);
          var vd=h(&#x27;div&#x27;,&#x27;bar-val&#x27;);vd.style.color=color;vd.textContent=pct+&#x27;%&#x27;;
          brow.appendChild(l);brow.appendChild(track);brow.appendChild(vd);return brow;
        }
        qBlock.appendChild(mkBar(isScale?&#x27;High (4-5)&#x27;:&#x27;Yes&#x27;,pos,&#x27;var(--pos)&#x27;));
        qBlock.appendChild(mkBar(isScale?&#x27;Low (1-2)&#x27;:&#x27;No&#x27;,neg,&#x27;var(--neg)&#x27;));
        if(neut&gt;0)qBlock.appendChild(mkBar(isScale?&#x27;Mid (3)&#x27;:&#x27;Other&#x27;,neut,&#x27;var(--muted)&#x27;));
        card.appendChild(qBlock);
      });
      pg.appendChild(card);
    });
  });
  if(!computed.length){var emp=h(&#x27;div&#x27;,&#x27;empty&#x27;);emp.textContent=&#x27;No heatmap data.&#x27;;pg.appendChild(emp);}
}

  var pt=h(&#x27;div&#x27;,&#x27;page-title&#x27;); pt.textContent=&#x27;Key Evidence &amp; Verbatims&#x27;;
  var ps=h(&#x27;div&#x27;,&#x27;page-sub&#x27;); ps.textContent=&#x27;Stakeholder evidence and open-ended responses&#x27;;
  hdr.appendChild(pt); hdr.appendChild(ps); pg.appendChild(hdr);

  // ── KPI IMPACT ASSESSMENT ─────────────────────────────────
  var _kpiS = (DB[&#x27;KPI Summary&#x27;]||[]);
  var _ttoR = _kpiS.find(function(r){return val(r,&#x27;KPI&#x27;)===&#x27;Time To Offer&#x27;;});
  var _crR  = _kpiS.find(function(r){return val(r,&#x27;KPI&#x27;)===&#x27;Panel-to-Offer Conversion Rate&#x27;;});
  var ttoValC= _ttoR ? val(_ttoR,&#x27;Value&#x27;).replace(/[~-]/g,&#x27;&#x27;).trim() : &#x27;N/A&#x27;;
  var crValC = _crR  ? val(_crR, &#x27;Value&#x27;).replace(/[~-]/g,&#x27;&#x27;).trim() : &#x27;N/A&#x27;;
  var _rawC  = (DB[&#x27;Detailed Responses&#x27;]||[]);
  // ── KPI IMPACT SUMMARY ───────────────────────────────────────────────────
  var kpiSummaryRows = _kpiS;
  var kpiTTO2  = kpiSummaryRows.find(function(r){return val(r,&#x27;KPI&#x27;)===&#x27;Time To Offer&#x27;;});
  var kpiCR2   = kpiSummaryRows.find(function(r){return val(r,&#x27;KPI&#x27;)===&#x27;Panel-to-Offer Conversion Rate&#x27;;});
  var kpiAPs   = kpiSummaryRows.filter(function(r){return val(r,&#x27;KPI&#x27;).indexOf(&#x27;Action Point&#x27;)===0;});
  var overallSummary = kpiTTO2 ? val(kpiTTO2,&#x27;Overall KPI Summary&#x27;) : &#x27;&#x27;;
  var ttoImpact= kpiTTO2 ? val(kpiTTO2,&#x27;Impact Summary&#x27;) : &#x27;&#x27;;
  var crImpact = kpiCR2  ? val(kpiCR2, &#x27;Impact Summary&#x27;) : &#x27;&#x27;;

  if(ttoImpact||crImpact||kpiAPs.length){
    var impLbl=h(&#x27;div&#x27;,&#x27;section-label&#x27;); impLbl.textContent=&#x27;KPI Impact Assessment&#x27;; pg.appendChild(impLbl);
    var impCard=dv(&#x27;card&#x27;); impCard.style.marginBottom=&#x27;16px&#x27;;

    // Overall headline
    if(overallSummary){
      var ov=dv(&#x27;&#x27;); ov.style.cssText=&#x27;font-size:13px;font-weight:600;color:var(--text);line-height:1.6;margin-bottom:14px;padding:10px 14px;background:var(--surface);border-radius:8px;border-left:3px solid var(--accent);&#x27;;
      ov.textContent=overallSummary;
      impCard.appendChild(ov);
    }

    // Two-column impact grid
    var impGrid=dv(&#x27;&#x27;); impGrid.style.cssText=&#x27;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;&#x27;;

    // Time To Offer impact
    if(ttoImpact){
      var ttoBox=dv(&#x27;&#x27;); ttoBox.style.cssText=&#x27;background:var(--surface);border-radius:8px;padding:12px;border-top:3px solid var(--accent3);&#x27;;
      var ttoHead=dv(&#x27;&#x27;); ttoHead.style.cssText=&#x27;display:flex;align-items:center;gap:7px;margin-bottom:8px;&#x27;;
      var ttoLabel2=h(&#x27;span&#x27;); ttoLabel2.style.cssText=&#x27;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent3);&#x27;; ttoLabel2.textContent=&#x27;Time To Offer Impact&#x27;;
      var ttoKV=h(&#x27;span&#x27;); ttoKV.style.cssText=&#x27;font-family:system-ui,sans-serif;font-size:12px;font-weight:700;color:var(--accent3);margin-left:auto;&#x27;; ttoKV.textContent=ttoValC;
      ttoHead.appendChild(ttoLabel2); ttoHead.appendChild(ttoKV);
      var ttoPara=dv(&#x27;&#x27;); ttoPara.style.cssText=&#x27;font-size:12px;color:var(--muted);line-height:1.65;&#x27;;
      ttoPara.textContent=ttoImpact;
      ttoBox.appendChild(ttoHead); ttoBox.appendChild(ttoPara);
      impGrid.appendChild(ttoBox);
    }

    // Conversion Rate impact
    if(crImpact){
      var crBox=dv(&#x27;&#x27;); crBox.style.cssText=&#x27;background:var(--surface);border-radius:8px;padding:12px;border-top:3px solid var(--accent4);&#x27;;
      var crHead=dv(&#x27;&#x27;); crHead.style.cssText=&#x27;display:flex;align-items:center;gap:7px;margin-bottom:8px;&#x27;;
      var crLabel2=h(&#x27;span&#x27;); crLabel2.style.cssText=&#x27;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent4);&#x27;; crLabel2.textContent=&#x27;Conversion Rate Impact&#x27;;
      var crKV2=h(&#x27;span&#x27;); crKV2.style.cssText=&#x27;font-family:system-ui,sans-serif;font-size:12px;font-weight:700;color:var(--accent4);margin-left:auto;&#x27;; crKV2.textContent=crValC;
      crHead.appendChild(crLabel2); crHead.appendChild(crKV2);
      var crPara=dv(&#x27;&#x27;); crPara.style.cssText=&#x27;font-size:12px;color:var(--muted);line-height:1.65;&#x27;;
      crPara.textContent=crImpact;
      crBox.appendChild(crHead); crBox.appendChild(crPara);
      impGrid.appendChild(crBox);
    }
    impCard.appendChild(impGrid);

    // Action Points
    if(kpiAPs.length){
      var apLbl=dv(&#x27;&#x27;); apLbl.style.cssText=&#x27;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;&#x27;; apLbl.textContent=&#x27;Combined Action Points&#x27;;
      impCard.appendChild(apLbl);
      var apGrid=dv(&#x27;&#x27;); apGrid.style.cssText=&#x27;display:grid;grid-template-columns:1fr 1fr;gap:8px;&#x27;;
      kpiAPs.forEach(function(ap,i){
        var apRow=dv(&#x27;&#x27;); apRow.style.cssText=&#x27;display:flex;gap:8px;align-items:flex-start;background:var(--surface);border-radius:6px;padding:9px 11px;&#x27;;
        var apNum=dv(&#x27;&#x27;); apNum.style.cssText=&#x27;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:system-ui,sans-serif;&#x27;; apNum.textContent=i+1;
        var apTxt=dv(&#x27;&#x27;); apTxt.style.cssText=&#x27;font-size:11px;color:var(--text);line-height:1.55;flex:1;&#x27;; apTxt.textContent=val(ap,&#x27;Value&#x27;);
        apRow.appendChild(apNum); apRow.appendChild(apTxt); apGrid.appendChild(apRow);
      });
      impCard.appendChild(apGrid);
    }

    pg.appendChild(impCard);
  }



  var cats=[];
  evidence.forEach(function(r){if(cats.indexOf(r.Category)&lt;0)cats.push(r.Category);});

  cats.forEach(function(cat){
    var lbl=h(&#x27;div&#x27;,&#x27;section-label&#x27;); lbl.textContent=cat; pg.appendChild(lbl);
    var catEv=evidence.filter(function(r){return r.Category===cat;});
    var stks=[];
    catEv.forEach(function(r){if(stks.indexOf(r.Stakeholder)&lt;0)stks.push(r.Stakeholder);});
    var grid=dv(&#x27;grid-3&#x27;);
    stks.forEach(function(stk){
      var card=dv(&#x27;card&#x27;);
      var ct=h(&#x27;div&#x27;,&#x27;card-title&#x27;);
      var sp=document.createElement(&#x27;span&#x27;); sp.className=stkcls(stk); sp.textContent=stk;
      ct.appendChild(sp); card.appendChild(ct);
      var stkEv=catEv.filter(function(r){return r.Stakeholder===stk;}).slice(0,3);
      stkEv.forEach(function(e){
        var txt=val(e,&#x27;Evidence&#x27;);
        var q=dv(&#x27;quote&#x27;); q.textContent=&#x27;\u201c&#x27;+txt.slice(0,180)+(txt.length&gt;180?&#x27;\u2026&#x27;:&#x27;&#x27;)+&#x27;\u201d&#x27;; card.appendChild(q);
      });
      grid.appendChild(card);
    });
    pg.appendChild(grid);
  });

  // Verbatims
  if(verbatim.length){
    var vLabel=h(&#x27;div&#x27;,&#x27;section-label&#x27;); vLabel.textContent=&#x27;Open-Ended Verbatims&#x27;; pg.appendChild(vLabel);
    var vCats=[];
    verbatim.forEach(function(r){if(vCats.indexOf(r.Category)&lt;0)vCats.push(r.Category);});
    vCats.forEach(function(cat){
      var catV=verbatim.filter(function(r){return r.Category===cat;});
      var card=dv(&#x27;card&#x27;); card.style.marginBottom=&#x27;12px&#x27;;
      var ct=h(&#x27;div&#x27;,&#x27;card-title&#x27;); ct.textContent=cat; card.appendChild(ct);
      catV.slice(0,6).forEach(function(r){
        var item=dv(&#x27;&#x27;); item.style.cssText=&#x27;padding:7px 0;border-bottom:1px solid var(--border);&#x27;;
        var meta=dv(&#x27;&#x27;); meta.style.cssText=&#x27;display:flex;gap:7px;align-items:center;margin-bottom:3px;&#x27;;
        var sp=document.createElement(&#x27;span&#x27;); sp.className=stkcls(val(r,&#x27;Stakeholder&#x27;)); sp.textContent=val(r,&#x27;Stakeholder&#x27;);
        meta.appendChild(sp);
        var q=val(r,&#x27;Question&#x27;);
        if(q){ var qSpan=h(&#x27;span&#x27;); qSpan.style.cssText=&#x27;font-size:10px;color:var(--muted);&#x27;; qSpan.textContent=q.slice(0,55)+&#x27;...&#x27;; meta.appendChild(qSpan); }
        item.appendChild(meta);
        var txt=val(r,&#x27;Text&#x27;);
        var tDiv=h(&#x27;div&#x27;); tDiv.style.cssText=&#x27;font-size:12px;line-height:1.6;&#x27;; tDiv.textContent=&#x27;\u201c&#x27;+txt.slice(0,250)+(txt.length&gt;250?&#x27;\u2026&#x27;:&#x27;&#x27;)+&#x27;\u201d&#x27;; item.appendChild(tDiv);
        card.appendChild(item);
      });
      pg.appendChild(card);
    });
  }
  if(!evidence.length&amp;&amp;!verbatim.length){ var emp=h(&#x27;div&#x27;,&#x27;empty&#x27;); emp.textContent=&#x27;No evidence data.&#x27;; pg.appendChild(emp); }
}
&lt;/script&gt;

<script>
var PASS = "exaze2025";

function checkPw(){
  var v = document.getElementById('pw-input').value;
  var err = document.getElementById('pw-error');
  if(v === PASS){
    document.getElementById('pw-screen').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    err.textContent='Incorrect password. Please try again.';
    document.getElementById('pw-input').value='';
    setTimeout(function(){ err.textContent=''; }, 3000);
  }
}

document.getElementById('pw-btn').addEventListener('click', checkPw);
document.getElementById('pw-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkPw();
});
</script>
